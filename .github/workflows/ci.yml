name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Linux amd64 & arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/taskaio-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/taskaio-linux-arm64 .
